name: Automated BGS Values & Wiki Sync

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Wiki & Collab Sync Engine
        run: node server/auto_sync_engine.cjs

      - name: Build Production Assets
        run: npm run build

      - name: Commit & Push Updated Values
        run: |
          git config --global user.name "BGS-AutoSync-Bot"
          git config --global user.email "bot@bgsvalues.com"
          git add src/data/pets.json server/data/pets.json
          if git diff --staged --quiet; then
            echo "No new updates found."
          else
            git commit -m "🤖 Auto-Sync: Refreshed latest pet values, demands, and new wiki additions [skip ci]"
            git push origin main
          fi

      - name: Deploy to GitHub Pages
        run: npm run deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
